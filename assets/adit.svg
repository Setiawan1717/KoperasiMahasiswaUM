<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" role="img" aria-labelledby="adit-judul">
  <title id="adit-judul">Adit, maskot KOPMA UM</title>
  <defs>
    <radialGradient id="kepala" cx="40%" cy="32%" r="75%">
      <stop offset="0" stop-color="#C8F5D4"/>
      <stop offset=".55" stop-color="#6FD68E"/>
      <stop offset="1" stop-color="#1FA352"/>
    </radialGradient>
    <linearGradient id="daunHijau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BE39A"/>
      <stop offset="1" stop-color="#009C3C"/>
    </linearGradient>
    <linearGradient id="daunBiru" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD6FA"/>
      <stop offset="1" stop-color="#0078C0"/>
    </linearGradient>
    <linearGradient id="jaket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22336E"/>
      <stop offset="1" stop-color="#141F4A"/>
    </linearGradient>
    <radialGradient id="tangan" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#B8F0C8"/>
      <stop offset="1" stop-color="#2DB866"/>
    </radialGradient>
  </defs>

  <!-- bayangan -->
  <ellipse cx="150" cy="330" rx="78" ry="8" fill="#13489B" opacity=".18"/>

  <!-- kaki -->
  <rect x="116" y="292" width="26" height="34" rx="10" fill="#1B2A5C"/>
  <rect x="158" y="292" width="26" height="34" rx="10" fill="#1B2A5C"/>
  <ellipse cx="127" cy="327" rx="20" ry="9" fill="#fff"/>
