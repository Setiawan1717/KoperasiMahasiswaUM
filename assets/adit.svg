  <path d="M70 252l-12 22" stroke="#FF8091" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="282" r="15" fill="url(#tangan)"/>

  <!-- lengan kanan (melambai) -->
  <path d="M206 222c20-6 38-24 46-48" stroke="url(#jaket)" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M236 196l12-14" stroke="#FF8091" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="164" r="15" fill="url(#tangan)"/>
  <path d="M268 146c6 4 9 10 9 16M274 138c9 6 13 15 13 24" stroke="#F9B867" stroke-width="3.5" stroke-linecap="round" fill="none"/>

