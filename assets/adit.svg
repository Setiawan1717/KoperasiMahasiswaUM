  <circle cx="185" cy="144" r="7" fill="#0A2456"/>
  <circle cx="126" cy="137" r="5" fill="#fff"/>
  <circle cx="190" cy="137" r="5" fill="#fff"/>
  <circle cx="116" cy="151" r="2.5" fill="#fff" opacity=".9"/>
  <circle cx="180" cy="151" r="2.5" fill="#fff" opacity=".9"/>

