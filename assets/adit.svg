  <ellipse cx="118" cy="140" rx="20" ry="24" fill="#fff"/>
  <ellipse cx="182" cy="140" rx="20" ry="24" fill="#fff"/>
  <circle cx="121" cy="144" r="14" fill="#13489B"/>
  <circle cx="185" cy="144" r="14" fill="#13489B"/>
